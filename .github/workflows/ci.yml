name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0
      - run: ruff check . && ruff format --check .
      - run: python3 -I scripts/test_scan_secrets.py
      # The RUNBOOK's nginx example keeps setup links and sign-in codes out of the proxy's logs (static checks, then
      # nginx itself with the example).
      - name: RUNBOOK proxy example logs no login secrets
        env:
          NODESTRO_PROXY_PROBE: "1"
        run: python3 -I scripts/test_runbook_proxy.py
      - name: Compose files are valid
        run: |
          python3 scripts/dev-secrets.py
          docker compose -f compose/compose.yaml config --quiet
          NODESTRO_EXTRA_CA_FILE=/etc/ssl/certs/ca-certificates.crt \
            docker compose -f compose/compose.yaml -f compose/extra-ca.yaml config --quiet
          docker compose -f compose/compose.yaml -f compose/all-switches.yaml config --quiet
      - name: Base images are pinned by digest
        run: |
          python3 -I - <<'PY'
          import re, sys
          text = open("image/Dockerfile").read()
          args = dict(re.findall(r"^ARG (\w+)=(\S+)", text, re.M))
          bases = [args.get(m.strip("${}"), m) for m in re.findall(r"^FROM (\S+)", text, re.M)]
          stages = set(re.findall(r"^FROM \S+ AS (\S+)", text, re.M)) | {"scratch"}
          loose = [base for base in bases if base not in stages and "@sha256:" not in base]
          # The privileged sandbox daemon of the compose stack (compose/sandbox/Dockerfile) as well.
          loose += [b for b in re.findall(r"^FROM (\S+)", open("compose/sandbox/Dockerfile").read(), re.M) if "@sha256:" not in b]
          # The stack's Python and PostgreSQL (pgvector) images too.
          compose = re.findall(r"image: (?:&\S+ )?((?:python|pgvector/pgvector):\S+)", open("compose/compose.yaml").read())
          loose += [image for image in compose if "@sha256:" not in image]
          sys.exit(f"not pinned by digest: {loose}" if loose else 0)
          PY
      - name: studio.json names a full commit
        run: python3 -c 'import json,re,sys; c=json.load(open("studio.json"))["nodestro-studio"]; sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", c) else 1)'

  e2e:
    # The acceptance tests of the server (plan step PR-12): image, compose stack, logins, tenants, sandbox, workers,
    # backup and restore; then once more with every Axentra migration switch on (compose/all-switches.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pytest==8.4.2 httpx==0.28.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: Build the image
        # The Nodestro components and orkexa are public: the build clones them anonymously (no token).
        run: |
          scripts/build-image.sh nodestro-server:ci
      - name: Build the Nodestro Local Docker target (the same definition, shared stages)
        env:
          NODESTRO_TARGET: local
        run: |
          scripts/build-image.sh nodestro-local:ci
          docker run --rm --network none --read-only --entrypoint python nodestro-local:ci -I -c \
            'import nodestro_api.local_container, nodestro_runtime.sandbox_gateway
          import boto3, botocore.session, orkexa.providers.bedrock
          session = botocore.session.get_session()
          for name in ("bedrock-runtime", "bedrock", "sts"):
              session.get_service_model(name)
          print("local target ok")'
      - name: Acceptance tests
        env:
          NODESTRO_IMAGE: nodestro-server:ci
        run: scripts/e2e.sh -v
      - name: Acceptance tests, every Axentra switch on
        # The same stack from scratch with compose/all-switches.yaml layered: the same test_acceptance.py plus the
        # switched-on paths (tests/e2e/test_all_switches.py). No switch is approved for production by this.
        env:
          NODESTRO_IMAGE: nodestro-server:ci
          NODESTRO_E2E_ALL_SWITCHES: "1"
        run: scripts/e2e.sh -v
      - name: Release manifest and secret scan (dry run)
        run: |
          docker save -o "$RUNNER_TEMP/image.tar" nodestro-server:ci
          python3 -I scripts/scan_secrets.py "$RUNNER_TEMP/image.tar"
          scripts/release-manifest.sh nodestro-server:ci "ci-${GITHUB_SHA::12}" "$RUNNER_TEMP/release"
          python3 -I scripts/scan_secrets.py "$RUNNER_TEMP/release"
