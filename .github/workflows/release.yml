name: Release

# A tag `v*` builds the server image from studio.json, runs every acceptance test against it, pushes it to the
# GitHub container registry of this repository and creates a **draft** GitHub release with the manifest (image
# digest, component pins, license inventory, signing state). A person reviews the draft and publishes it.
# A manual run builds and tests the same image and writes the manifest without pushing or releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the draft release (tags only)
      packages: write # the image in ghcr.io (tags only)
    env:
      IMAGE: ghcr.io/peterkarlhuber/nodestro-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest==8.4.2 httpx==0.28.1
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the image
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          scripts/build-image.sh nodestro-server:release
      - name: Acceptance tests
        env:
          NODESTRO_IMAGE: nodestro-server:release
        run: scripts/e2e.sh -v
      - name: Push the image (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag nodestro-server:release "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME" > "$RUNNER_TEMP/published"
          docker logout ghcr.io
      - name: Release manifest
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="manual-${GITHUB_SHA::12}"
          published=""
          if [ -f "$RUNNER_TEMP/published" ]; then published="$(cat "$RUNNER_TEMP/published")"; fi
          scripts/release-manifest.sh nodestro-server:release "$version" release "$published"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["images"], "unknown licenses:", m["licenses"]["unknown"])' release/release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          retention-days: 30
      - name: Create the draft release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Nodestro Server $GITHUB_REF_NAME (linux/amd64)" \
            --notes "Image: $(cat "$RUNNER_TEMP/published"). Every acceptance test passed against this image before it was pushed. Component pins, license inventory and signing state (not signed) are in release-manifest.json. See docs/RUNBOOK.md for upgrades and rollback."
