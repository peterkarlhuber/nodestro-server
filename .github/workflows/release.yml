name: Release candidate

# Builds and checks a release candidate. It never publishes anything: no tag, no GitHub release, no registry push,
# and its token can only read. A person starts it with the version; it builds the image from studio.json, runs every
# acceptance test against it, saves the image, scans it for secrets and writes the manifest. Everything goes into
# the run's `release-candidate` artifact. Publishing is a separate, manual step: publish.yml with this run's ID.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.2.0-preview.1"
        required: true

permissions:
  contents: read

jobs:
  nightly-gate:
    # CI-FAST release lock: no candidate and no publication unless the latest completed nightly (nightly.yml on master)
    # of this repository and of nodestro-studio (public; read with this run's token) passed and is less than 36 hours old.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: The latest nightlies of this repository and of nodestro-studio passed within 36 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          for repo in "$GITHUB_REPOSITORY" peterkarlhuber/nodestro-studio; do
            if ! gh api "repos/$repo/actions/workflows/nightly.yml/runs?branch=master&status=completed&per_page=1" > nightly.json; then
              echo "::error::$repo: cannot read the runs of nightly.yml"; status=1; continue
            fi
            python3 -I - "$repo" nightly.json <<'PY' || status=1
          import datetime, json, sys
          repo, path = sys.argv[1], sys.argv[2]
          runs = json.load(open(path)).get("workflow_runs") or []
          if not runs:
              sys.exit(f"::error::{repo}: no completed nightly.yml run on master")
          run = runs[0]
          started = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - started
          print(f"{repo}: nightly {run['html_url']} {run['conclusion']}, started {run['created_at']} ({age} ago)")
          if run["conclusion"] != "success":
              sys.exit(f"::error::{repo}: the latest nightly did not pass ({run['conclusion']}): {run['html_url']}")
          if age >= datetime.timedelta(hours=36):
              sys.exit(f"::error::{repo}: the latest nightly is older than 36 hours: {run['html_url']}")
          PY
          done
          exit "$status"

  candidate:
    needs: nightly-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pytest==8.4.2 httpx==0.28.1
      - run: python3 -I scripts/test_scan_secrets.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build the image
        run: |
          NODESTRO_VERSION="$VERSION" scripts/build-image.sh nodestro-server:candidate
      - name: Acceptance tests
        env:
          NODESTRO_IMAGE: nodestro-server:candidate
        run: scripts/e2e.sh -v
      - name: Save the image and scan it for secrets
        run: |
          mkdir -p release
          name="nodestro-server-${VERSION}-linux-amd64.tar"
          docker save -o "$RUNNER_TEMP/$name" nodestro-server:candidate
          python3 -I scripts/scan_secrets.py "$RUNNER_TEMP/$name"
          gzip -n -c "$RUNNER_TEMP/$name" > "release/$name.gz"
      - name: Release manifest
        run: |
          scripts/release-manifest.sh nodestro-server:candidate "$VERSION" release "release/nodestro-server-${VERSION}-linux-amd64.tar.gz"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["version"], m["channel"], m["images"], "unknown licenses:", m["licenses"]["unknown"])' release/release-manifest.json
      - name: Vulnerability scan of the image (scripts/scan-vulnerabilities.sh; the reports go into the candidate)
        run: |
          pip install pip-audit==2.10.1
          scripts/scan-vulnerabilities.sh nodestro-server:candidate release/vulnerabilities
      - name: Scan the release files for secrets
        run: python3 -I scripts/scan_secrets.py release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          retention-days: 30
