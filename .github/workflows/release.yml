name: Release candidate

# Builds and checks a release candidate. It never publishes anything: no tag, no GitHub release, no registry push,
# and its token can only read. A person starts it with the version; it builds the image from studio.json, runs every
# acceptance test against it, saves the image, scans it for secrets and writes the manifest. Everything goes into
# the run's `release-candidate` artifact. Publishing is a separate, manual step: publish.yml with this run's ID.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.2.0-preview.1"
        required: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pytest==8.4.2 httpx==0.28.1
      - run: python3 -I scripts/test_scan_secrets.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build the image
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          NODESTRO_VERSION="$VERSION" scripts/build-image.sh nodestro-server:candidate
      - name: Acceptance tests
        env:
          NODESTRO_IMAGE: nodestro-server:candidate
        run: scripts/e2e.sh -v
      - name: Save the image and scan it for secrets
        env:
          NODESTRO_SCAN_SECRETS: ${{ secrets.NODESTRO_READ }}
        run: |
          mkdir -p release
          name="nodestro-server-${VERSION}-linux-amd64.tar"
          docker save -o "$RUNNER_TEMP/$name" nodestro-server:candidate
          python3 -I scripts/scan_secrets.py "$RUNNER_TEMP/$name"
          gzip -n -c "$RUNNER_TEMP/$name" > "release/$name.gz"
      - name: Release manifest
        run: |
          scripts/release-manifest.sh nodestro-server:candidate "$VERSION" release "release/nodestro-server-${VERSION}-linux-amd64.tar.gz"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["version"], m["channel"], m["images"], "unknown licenses:", m["licenses"]["unknown"])' release/release-manifest.json
      - name: Scan the release files for secrets
        env:
          NODESTRO_SCAN_SECRETS: ${{ secrets.NODESTRO_READ }}
        run: python3 -I scripts/scan_secrets.py release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          retention-days: 30
