# Weekly, grouped update pull requests with a small limit. Every action in the workflows is pinned by commit SHA
# (the version is the trailing comment); Dependabot keeps those pins current.
# cooldown: a new release is proposed only after a few days, so a broken or compromised release
# is usually withdrawn before it reaches a pull request; security updates are not delayed. Merging stays manual
# (no auto-merge; nodestro-studio docs/TODO.md ST-052).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
  # Base images by tag and digest: the image's own bases (image/Dockerfile), the Docker-in-Docker sandbox, and the
  # images compose/compose.yaml runs (pgvector, Python, Dex).
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    ignore:
      # Python stays 3.13 (PYTHON_VERSION in image/Dockerfile and the studio's support range); Node.js stays 22 until
      # the planned move to Node.js 24 (Q1 2027). Digest updates of the same tags still come.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /compose/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
  # The vulnerability scanner (Trivy) of scripts/scan-vulnerabilities.sh, by tag and digest.
  - package-ecosystem: docker
    directory: /scripts/scanner
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: nodestro-sandbox-dind # built locally from compose/sandbox
