# Weekly, grouped update pull requests with a small limit. Every action in the workflows is pinned by commit SHA
# (the version is the trailing comment); Dependabot keeps those pins current.
# cooldown: a new release is proposed only after a few days, so a broken or compromised release
# is usually withdrawn before it reaches a pull request; security updates are not delayed. Merging stays manual
# (no auto-merge; nodestro-studio docs/TODO.md ST-052).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
  # Base images by tag and digest: the Docker-in-Docker sandbox, and the images compose/compose.yaml runs (pgvector,
  # Python, Dex). The image's own bases (image/Dockerfile ARG PYTHON_IMAGE, NODE_IMAGE) are build arguments, which
  # Dependabot does not update: change them together with compose.yaml's python image.
  - package-ecosystem: docker
    directory: /compose/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: nodestro-sandbox-dind # built locally from compose/sandbox
