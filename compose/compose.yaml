# Nodestro server for development and the end-to-end tests (Linux): PostgreSQL, Dex (OpenID Connect), an isolated
# Docker daemon for tool code (Docker-in-Docker with TLS), an OpenAI-compatible model stub, and the server's API and
# worker. Every port is published on 127.0.0.1 only. Production: see docs/RUNBOOK.md.
#
#   python3 scripts/dev-secrets.py          # once: random secrets and passwords in compose/.secrets/
#   docker compose -f compose/compose.yaml up -d --wait
#   open http://localhost:8080
#
# The API and the worker use the host's network, so http://localhost:5556/dex is the same issuer for the browser and
# for the server, and the sandbox daemon is reached at localhost:2376.
name: nodestro

x-server: &server
  image: ${NODESTRO_IMAGE:-nodestro-server:dev}
  network_mode: host
  restart: unless-stopped
  environment: &server-environment
    NODESTRO_PROFILE: server
    NODESTRO_PUBLIC_ORIGIN: http://localhost:8080
    NODESTRO_OIDC_ISSUER: http://localhost:5556/dex
    NODESTRO_OIDC_CLIENT_ID: nodestro-studio
    NODESTRO_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    NODESTRO_DATABASE_URL_FILE: /run/secrets/database_url
    NODESTRO_SECRET_KEY_FILE: /run/secrets/secret_key
    NODESTRO_MODEL_ENDPOINTS: http://localhost:9100
    # Amazon Bedrock (docs/RUNBOOK.md, "Amazon Bedrock for tenants"): off for every tenant unless the operator assigns
    # an IAM role. Tenants never use this server's own AWS credentials.
    # NODESTRO_BEDROCK_TENANT_ROLES_FILE: /run/secrets/bedrock_tenant_roles  # {"<tenant_id>": {"role_arn": "…", "external_id": "…"}}
    # NODESTRO_BEDROCK_DATA_RESIDENCY: eu_only
    # NODESTRO_BEDROCK_ALLOWED_REGIONS: eu-central-1,eu-west-1
    # Axentra platform services (docs/RUNBOOK.md): off unless switched on. The API and the worker connect as
    # nodestro_app (no superuser, no BYPASSRLS, owns nothing), so Axentra's row-level security applies to them.
    # compose/all-switches.yaml turns every switch on at once (development and the end-to-end tests only).
    # NODESTRO_AXENTRA: "on"
    # NODESTRO_AXENTRA_KEYRING_FILE: /run/secrets/axentra_keyring  # k1:<base64 32 bytes>
    # NODESTRO_AXENTRA_AUDIT: "1"
    # NODESTRO_AXENTRA_USAGE: "1"
    # NODESTRO_IDENTITY_BACKEND: mirror  # after `nodestro-server axentra backfill-identity`
    # One JSON object per log line with the request id (docs/RUNBOOK.md, "Metrics and status"), as in production.
    NODESTRO_LOG_FORMAT: json
    NODESTRO_WORKER_LEASE_SECONDS: ${NODESTRO_WORKER_LEASE_SECONDS:-60}
    NODESTRO_WORKER_REAP_SECONDS: ${NODESTRO_WORKER_REAP_SECONDS:-15}
    DOCKER_HOST: tcp://localhost:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /run/sandbox-certs/client
  secrets: [database_url, oidc_client_secret, secret_key]
  volumes:
    - data:/var/lib/nodestro
    - sandbox-certs:/run/sandbox-certs:ro

services:
  # The superuser `nodestro` administers the database only; no server process uses it (docs/RUNBOOK.md, "Database
  # roles"). The server's roles nodestro_owner (owns the tables: migrate, backup, restore) and nodestro_app (the API
  # and the worker) are created by the db-roles service.
  # PostgreSQL 17 with pgvector (the official postgres:17 image plus the extension; same data format). pgvector lets
  # the database rank the vectors of semantic knowledge search; db-roles installs it (docs/RUNBOOK.md, "Semantic
  # knowledge search"). Pinned by digest of the multi-platform index.
  postgres:
    # NODESTRO_POSTGRES_IMAGE: another major version for the tests (docs/RUNBOOK.md, "System requirements (tested)").
    image: &postgres-image ${NODESTRO_POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8}
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodestro
      POSTGRES_DB: nodestro
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${NODESTRO_DB_PORT:-55433}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nodestro", "-d", "nodestro"]
      interval: 2s
      timeout: 5s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml.tmpl"]
    env_file: [.secrets/dex.env]
    volumes: ["./dex/config.yaml.tmpl:/etc/dex/config.yaml.tmpl:ro"]
    ports: ["127.0.0.1:5556:5556"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The Docker daemon that runs tool code. It is not the host's daemon: tool containers, their images and the
  # daemon's network live inside this container. TLS with client certificates; the port is on 127.0.0.1 only.
  # Built from docker:29.9.2-dind plus the AppArmor parser, so that on an AppArmor host the daemon confines its
  # containers with docker-default (Nodestro's self-test refuses unconfined containers there; sandbox/Dockerfile).
  sandbox:
    build: ./sandbox
    image: nodestro-sandbox-dind:29.9.2
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - sandbox-certs:/certs
      - sandbox-data:/var/lib/docker
    ports: ["127.0.0.1:2376:2376"]
    healthcheck:
      test: ["CMD", "docker", "--host=tcp://localhost:2376", "--tlsverify", "--tlscacert=/certs/client/ca.pem",
             "--tlscert=/certs/client/cert.pem", "--tlskey=/certs/client/key.pem", "version"]
      interval: 2s
      timeout: 10s
      retries: 60

  model-stub:
    image: python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc
    restart: unless-stopped
    command: ["python", "-I", "/stub/stub.py"]
    read_only: true
    user: "65534:65534"
    volumes: ["./model-stub:/stub:ro"]
    ports: ["127.0.0.1:9100:9100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates or updates the roles nodestro_owner and nodestro_app (compose/postgres/roles.sql, idempotent) and installs
  # pgvector, then exits.
  # Runs on every start, so a database created before these roles is moved over too: the tables the superuser owned
  # are given to nodestro_owner.
  db-roles:
    image: *postgres-image
    restart: "no"
    entrypoint: ["/etc/nodestro/roles.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: nodestro
      POSTGRES_DB: nodestro
    secrets: [postgres_password, postgres_owner_password, postgres_app_password]
    volumes:
      - ./postgres/roles.sh:/etc/nodestro/roles.sh:ro
      - ./postgres/roles.sql:/etc/nodestro/roles.sql:ro
    depends_on:
      postgres: {condition: service_healthy}

  # Applies the database migrations as nodestro_owner, grants nodestro_app its privileges, then exits. A database with
  # tables is backed up first (pg_dump). Also the service for the owner's commands (docs/RUNBOOK.md):
  #   docker compose run --rm --no-deps migrate db roles
  migrate:
    <<: *server
    restart: "no"
    command: ["migrate", "--backup-dir", "/var/lib/nodestro/backups"]
    environment:
      <<: *server-environment
      NODESTRO_DATABASE_MIGRATION_URL_FILE: /run/secrets/database_migration_url
    secrets: [database_url, database_migration_url, oidc_client_secret, secret_key]
    depends_on:
      db-roles: {condition: service_completed_successfully}

  api:
    <<: *server
    command: ["api", "--host", "127.0.0.1", "--port", "8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      sandbox: {condition: service_healthy}
      dex: {condition: service_healthy}
    healthcheck:
      # Readiness: 503 while the process starts, stops or cannot reach the database (docs/RUNBOOK.md, "Health checks").
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready')"]
      interval: 2s
      timeout: 5s
      retries: 60

  worker:
    <<: *server
    command: ["worker"]
    environment:
      <<: *server-environment
      # Liveness of the worker itself (docs/RUNBOOK.md, "Health checks"): a heartbeat file inside this container.
      NODESTRO_WORKER_HEARTBEAT_FILE: /tmp/nodestro-worker.json
    depends_on:
      migrate: {condition: service_completed_successfully}
      sandbox: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nodestro-server", "worker-health"]
      interval: 10s
      timeout: 10s
      retries: 30

secrets:
  postgres_password: {file: .secrets/postgres_password}
  postgres_owner_password: {file: .secrets/postgres_owner_password}
  postgres_app_password: {file: .secrets/postgres_app_password}
  database_url: {file: .secrets/database_url}  # nodestro_app: the API and the worker
  database_migration_url: {file: .secrets/database_migration_url}  # nodestro_owner: migrate, backup, restore
  oidc_client_secret: {file: .secrets/oidc_client_secret}
  secret_key: {file: .secrets/secret_key}

volumes:
  postgres:
  data:
  sandbox-certs:
  sandbox-data:
