# Layered by scripts/browser-e2e.sh (tests only): the development stack behind Caddy as the TLS proxy, so a browser
# uses the studio as it would in production, over https with the `__Host-` cookies. Caddy listens on
# https://localhost:${NODESTRO_TLS_PORT:-8443} with a certificate from its own local certificate authority and forwards
# to the API on 127.0.0.1:8080; the server's public origin and Dex's redirect address are that https origin. Caddy
# writes no access log (as in compose/production.example.yaml), so setup links and sign-in codes are never logged.
x-tls-origin: &tls-origin
  environment:
    NODESTRO_PUBLIC_ORIGIN: https://localhost:${NODESTRO_TLS_PORT:-8443}
    # Caddy connects from 127.0.0.1 (host network): the only address that may set X-Forwarded-For.
    NODESTRO_BEHIND_PROXY: "1"
    FORWARDED_ALLOW_IPS: 127.0.0.1

services:
  dex:
    environment:
      NODESTRO_TLS_ORIGIN: https://localhost:${NODESTRO_TLS_PORT:-8443}
  migrate: *tls-origin
  api: *tls-origin
  worker: *tls-origin

  caddy:
    image: caddy:2.11.1-alpine@sha256:3b2a0196e0687279c14c27adff9fc6b44acfa318dbb97eaebe385bdf99e5364c
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # the caddy binary carries this file capability; it does not start without it
    security_opt: ["no-new-privileges:true"]
    # `localhost` gets a certificate from Caddy's local authority (/data/caddy/pki/authorities/local/root.crt), which
    # the browser test reads to verify the proxy before it trusts exactly that certificate. No HTTP redirect listener.
    command: ["caddy", "reverse-proxy", "--from", "https://localhost:${NODESTRO_TLS_PORT:-8443}", "--to", "127.0.0.1:8080",
              "--disable-redirects", "--internal-certs"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Healthy once Caddy has created its local authority (it issues the certificate for localhost at its start).
    healthcheck:
      test: ["CMD", "test", "-s", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 1s
      timeout: 5s
      retries: 60
    depends_on:
      api: {condition: service_healthy}

volumes:
  caddy-data:
  caddy-config:
